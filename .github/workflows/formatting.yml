name: Code Formatting Check & Auto-Fix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  clang-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Install Clang-Format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run Clang-Format
        run: |
          find src include kernels tests benchmark -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" -o -name "*.cu" -o -name "*.cuh" \) -exec clang-format -i {} +

      - name: Check for Unformatted Changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "formatted=true" >> $GITHUB_OUTPUT
          else
            echo "formatted=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto-Commit and Push Formatted Changes
        if: steps.git-check.outputs.formatted == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -a -m "style: auto-format C++/CUDA code with clang-format"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
